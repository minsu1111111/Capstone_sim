# two_real 부품 배치 v1: 구매 리스트 부품 그대로 (검사 결과: 2마디에 안 들어감 — 기록용)
#   shape: box [x, y, z 크기] | cyl_x [지름, 길이] (축이 x) | cyl_z [지름, 길이] (축이 z) | mass (질량만)
#   external: true -> 몸통 밖(노즈 캡, 측면 창, 관절부)에 있어도 됨
#   est: true -> 치수·무게 추정 (실물 확인 필요)
# 검사: ros2 run pipe_robot_sim layout_check two_real   (--apply 하면 robot.yaml 의 질량·무게중심 갱신)

hull:
  outer_d: 56
  wall: 2.0              # PLA 출력 벽 두께
  density: 1.24          # g/cm^3 (PLA)
wheel_module:            # 바퀴 + 슬라이더 + 스프링 + N20 이 움직이는 공간 (부품 금지 구역)
  x_half: 18             # 바퀴 고리 위치(마디 중심) ±18 mm
  angles: [90, 210, 330]
  half_width: 9          # 원주 방향 반폭 (바퀴 폭 8 + 모터 10 기준)
  r_min: 13              # 바퀴가 다 눌렸을 때 안쪽 끝 (중심에서 13 mm)

segments:
  front:                 # 앞마디: 연산·센서·주행 제어
    length: 90
    parts:
      - {name: pi_zero_2w,   shape: box,   size: [65, 30, 5],  pos: [0, 0, 4.5],     mass: 11}
      - {name: esp32_main,   shape: box,   size: [55, 28, 5],  pos: [0, 0, -1],      mass: 9}
      - {name: cell_18650_1, shape: cyl_x, size: [18.4, 65],   pos: [0, 0, -14.6],   mass: 48}
      - {name: drv8833_a,    shape: box,   size: [18, 16, 4],  pos: [32, -9, 10],    mass: 2}
      - {name: drv8833_b,    shape: box,   size: [18, 16, 4],  pos: [32, 9, 10],     mass: 2}
      - {name: mp1584_logic, shape: box,   size: [22, 17, 4],  pos: [-31, -9, 10],   mass: 2}
      - {name: mp1584_servo, shape: box,   size: [22, 17, 4],  pos: [-31, 9, 10],    mass: 2}
      - {name: mpu6050,      shape: box,   size: [21, 16, 3],  pos: [0, 0, 10],      mass: 2}
      - {name: bms_2s,       shape: box,   size: [40, 3, 8],   pos: [30, 14, -9],    mass: 3}
      - {name: vl6180_left,  shape: box,   size: [18, 3, 13],  pos: [30, 23.5, 0],   mass: 2}
      - {name: vl6180_right, shape: box,   size: [18, 3, 13],  pos: [30, -23.5, 0],  mass: 2}
      - {name: camera_ov5647, shape: box,  size: [9, 25, 24],  pos: [50, 0, 0],      mass: 4, external: true}
      - {name: led_ring,     shape: box,   size: [3, 20, 20],  pos: [56, 0, 0],      mass: 3, external: true}
      - {name: tof_vl53l5cx, shape: box,   size: [3, 13, 13],  pos: [58, 0, -12],    mass: 2, external: true}
      - {name: servo_pitch,  shape: box,   size: [22.5, 12, 30], pos: [-58, 0, 0],   mass: 14, external: true}
      - {name: servo_yaw,    shape: box,   size: [22.5, 30, 12], pos: [-70, 0, 0],   mass: 14, external: true}
      - {name: wheel_modules, shape: mass, pos: [0, 0, 0],     mass: 78}   # N20 12 g + 바퀴 8 + 슬라이더·스프링 6 = 26 x 3
      - {name: wiring,       shape: mass,  pos: [0, 0, 0],      mass: 15}

  rear:                  # 뒷마디: UT 검사 + 전원
    length: 110
    parts:
      - {name: cell_18650_2, shape: cyl_x, size: [18.4, 65],   pos: [20, 0, -14.6],  mass: 48}
      - {name: esp32_ut,     shape: box,   size: [55, 28, 5],  pos: [20, 0, -1],     mass: 9}
      - {name: ut_board,     shape: box,   size: [50, 30, 10], pos: [20, 0, 7],      mass: 12, est: true}
      - {name: hv_ham1518,   shape: box,   size: [32, 22, 12], pos: [38, 0, 18],     mass: 8,  est: true}
      - {name: boost_12v,    shape: box,   size: [36, 6, 17],  pos: [38, 16, -12],   mass: 3}
      - {name: stepper_28byj48, shape: cyl_x, size: [28, 19],  pos: [-16, 0, 0],     mass: 30}
      - {name: ut_hub,       shape: cyl_x, size: [52, 30],     pos: [-40, 0, 0],     mass: 20, est: true}   # 회전 허브 + SG90 들기
      - {name: probe_5p14n,  shape: cyl_z, size: [20, 30],     pos: [-40, 0, -30],   mass: 25, est: true, external: true}
      - {name: pump_adafruit3910, shape: box, size: [58, 34, 27], pos: [20, 0, 15],  mass: 55, est: true}
      - {name: tank_10ml,    shape: cyl_x, size: [16, 65],     pos: [20, 0, 17],     mass: 15}
      - {name: wheel_modules, shape: mass, pos: [0, 0, 0],     mass: 78}
      - {name: wiring,       shape: mass,  pos: [0, 0, 0],      mass: 15}
